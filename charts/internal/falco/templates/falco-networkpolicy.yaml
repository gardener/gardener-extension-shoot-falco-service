{{- if .Values.falcosidekick.deployNetworkPolicies }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gardener.cloud--deny-falco-webserver-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "falco.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  ingress: []
  policyTypes:
  - Ingress
{{- end }}
